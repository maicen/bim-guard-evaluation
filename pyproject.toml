[project]
name = "bim-guard-evaluation"
version = "0.1.0"
description = "Evaluation harnesses, NLP annotation capabilities, accuracy scoring, and research validation analysis for BIM-Guard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "doclang>=0.7.3",
    "docling-slim>=2.127.0",
    "duckdb>=1.5.5",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "ifcopenshell>=0.8.4.post1",
    "matplotlib>=3.8.0",
    "networkx>=3.6.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pydantic>=2.7.0",
    "pypdf>=6.19.0",
    "rapidfuzz>=3.14.6",
    "scipy>=1.11.0",
    "starlette>=0.36.0",
    "tabulate>=0.9.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "debugpy>=1.8.0",
]
llm = [
    "anthropic>=0.20.0",
    "openai>=1.12.0",
    "litellm>=1.35.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlp_annotation", "eval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["eval/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["research/", "sources/", "docs/archive/"]

[tool.ruff.lint]
# Moderate rule set for a first pass on a repo that has never been linted:
# pyflakes (F) and pycodestyle errors (E) catch real bugs (unused imports,
# undefined names, bare except); UP modernizes to the Python version this
# repo actually targets; I sorts imports consistently. Deliberately not
# enabling stricter families (ANN, D, B, S, ...) yet -- that is a separate,
# larger pass tracked in the repository rebuild plan, not a Phase-0 change.
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",  # line-length is a formatter concern; several long lines here
             # are prose docstrings/comments intentionally kept unwrapped.
]

[tool.ruff.lint.per-file-ignores]
# Gold-standard/data modules read like prose on purpose.
"eval/eval_gold_code_9_8_stairs.py" = ["E501"]

